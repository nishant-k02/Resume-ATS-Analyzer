version: 1
applications:
  - appRoot: .
    frontend:
      phases:
        preBuild:
          commands:
            - pnpm install --frozen-lockfile
            - echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY" >> .env.production
            - echo "ANTHROPIC_MODEL=$ANTHROPIC_MODEL" >> .env.production
        build:
          commands:
            - pnpm build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
